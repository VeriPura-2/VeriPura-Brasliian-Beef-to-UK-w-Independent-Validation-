<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriPura Core demonstration: five trade routes</title>
<style>
:root{
  --bg:#F2F5FA;--side:#E6ECF5;--card:#FFFFFF;--card2:#F6F8FC;--line:#D3DBE8;--ink:#0F2444;--ink2:#2B4066;--mut:#5B6C88;
  --gold:#B8861B;--gold-bg:#D9A93F;--gold-ink:#0F2444;--blue:#2E55C9;--tint:#E7ECF8;
  --ok:#2B8A3E;--ok-bg:#E6F4EA;--rev:#A8660F;--rev-bg:#FBF0DD;--mis:#A8352A;--mis-bg:#F8E4E1;--nc:#44546B;--nc-bg:#E9EDF3;
  --paper:#FBFAF6;--paper-ink:#1C2433;--paper-line:#D9D5C8;
  --serif:'DM Serif Display','Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0F2444;--side:#0C1D3A;--card:#1A3260;--card2:#152B54;--line:#2D4574;--ink:#E9EFF8;--ink2:#CBD6E6;--mut:#9FB0CC;
  --gold:#E2B64E;--gold-bg:#D9A93F;--gold-ink:#0F2444;--blue:#8AA8FF;--tint:#1E3A70;
  --ok:#69DB7C;--ok-bg:#173B22;--rev:#F2B566;--rev-bg:#3A2A12;--mis:#F29488;--mis-bg:#3C1B18;--nc:#B2BFD2;--nc-bg:#22375C;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;display:flex;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
/* sidebar */
aside{width:272px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px 24px}
.brand{display:flex;align-items:center;gap:8px;margin:0 6px 18px}
.brand .word{font-family:var(--serif);font-size:26px;line-height:1;color:var(--ink)}
.brand .word b{color:var(--gold);font-weight:400}
.brand sup{font-family:var(--sans);font-size:10px;color:var(--mut)}
.tag-demo{font-family:var(--mono);font-size:10px;letter-spacing:.1em;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:2px 6px;background:transparent}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--ink2);min-height:40px}
.nav-i:hover{background:var(--tint)}
.nav-i.on{background:var(--tint);color:var(--ink);font-weight:600}
.nav-i .n{font-family:var(--mono);font-size:11px;color:var(--mut);width:22px;flex-shrink:0}
.nav-i .t{flex:1;font-size:13.5px;line-height:1.3}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex-shrink:0;border:1.5px solid var(--mut)}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.rev{background:var(--rev);border-color:var(--rev)}.dot.mis{background:var(--mis);border-color:var(--mis)}.dot.nc{background:var(--nc);border-color:var(--nc)}
.side-sec{margin:18px 8px 6px}
/* main */
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.01em}
.top .sp{flex:1}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--card);color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block}
.theme{border:1px solid var(--line);background:var(--card);border-radius:999px;width:56px;height:30px;position:relative}
.theme span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--gold-bg);transition:left .2s;display:grid;place-items:center;font-size:12px;color:var(--gold-ink)}
:root[data-theme="dark"] .theme span{left:29px}
.banner{margin:0 32px;margin-top:18px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{padding:22px 32px 130px;max-width:1240px;width:100%}
h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.15;margin-bottom:6px}
h3{font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:10px}
.lede{color:var(--ink2);font-size:16px;max-width:70ch;margin-bottom:18px}
.btn{border-radius:8px;border:1.5px solid var(--line);background:var(--card);padding:10px 16px;font-weight:600;font-size:14px;letter-spacing:.02em;min-height:44px}
.btn:hover{border-color:var(--blue)}
.btn.gold{background:var(--gold-bg);border-color:var(--gold-bg);color:var(--gold-ink);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.btn.gold:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin-top:6px}
.stat.ok b{color:var(--ok)}.stat.rev b{color:var(--rev)}.stat.mis b{color:var(--mis)}.stat.nc b{color:var(--nc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--mut)}
.phase-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.phase-head .num{font-family:var(--mono);color:var(--gold);font-size:14px;letter-spacing:.1em}
.phase-head .sp{flex:1}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.sec-title{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sec-title .label{flex:1}
/* paper documents */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:13px;min-height:36px}
.tab.on{border-color:var(--gold);color:var(--gold);font-weight:600}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:22px 24px;box-shadow:0 1px 0 rgba(0,0,0,.04),6px 6px 0 rgba(15,36,68,.10);position:relative}
.paper .stamp.s1{color:#1d6b3a;border-color:#1d6b3a}.paper .stamp.s3{color:#9a6b00;border-color:#d9a93f}.paper .stamp{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#8a8574;border:1px dashed #b9b4a2;padding:3px 7px;border-radius:3px}
.paper h4{font-family:var(--serif);font-weight:400;font-size:21px;margin-bottom:2px;padding-right:130px}
.paper .ref{font-family:var(--mono);font-size:11.5px;color:#6b6858;margin-bottom:14px;letter-spacing:.04em}
.paper .row{display:grid;grid-template-columns:42% 1fr;gap:10px;border-top:1px solid #E6E2D5;padding:6px 6px;font-size:13.5px;border-radius:3px;transition:background .3s}
.paper .row:first-of-type{border-top:2px solid #1C2433}
.paper .row span:first-child{color:#6b6858}
.paper .row span:last-child{font-family:var(--mono);font-size:12.5px;word-break:break-word}
.paper table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
.paper th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6b6858;text-align:left;padding:6px;border-bottom:2px solid #1C2433}
.paper td{padding:5px 6px;border-bottom:1px solid #E6E2D5;font-family:var(--mono);font-size:12px;transition:background .3s}
.paper .note{margin-top:12px;font-size:12px;color:#6b6858;font-style:italic}
.f-ok{background:#DDF1E1!important}.f-rev{background:#FBE7BE!important}.f-mis{background:#F6CFC9!important}.f-nc{background:#E1E6EE!important}
.f-mis{box-shadow:inset 3px 0 0 #A8352A}.f-rev{box-shadow:inset 3px 0 0 #A8660F}.f-ok{box-shadow:inset 3px 0 0 #2B8A3E}.f-nc{box-shadow:inset 3px 0 0 #44546B}
.cap{font-size:12px;color:var(--mut);margin-top:8px}
/* findings */
.find{border:1px solid var(--line);border-left-width:4px;border-radius:10px;background:var(--card);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.find.new{animation:in .35s ease both}
.find:hover{border-color:var(--blue)}
.find.ok{border-left-color:var(--ok)}.find.rev{border-left-color:var(--rev)}.find.mis{border-left-color:var(--mis)}.find.nc{border-left-color:var(--nc)}
.find .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.find .p{font-weight:700;flex:1;min-width:140px}
.find .a{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em}
.find .d{margin-top:6px;font-size:14px;color:var(--ink2)}
.find .r{margin-top:4px;font-family:var(--mono);font-size:11px;color:var(--mut)}
.tg{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 8px;white-space:nowrap}
.tg.ok{background:var(--ok-bg);color:var(--ok)}.tg.rev{background:var(--rev-bg);color:var(--rev)}.tg.mis{background:var(--mis-bg);color:var(--mis)}.tg.nc{background:var(--nc-bg);color:var(--nc)}
.tg.dev{background:var(--rev-bg);color:var(--rev)}.tg.prop{background:var(--tint);color:var(--blue)}
.running{display:flex;align-items:center;gap:10px;color:var(--mut);font-family:var(--mono);font-size:12px;padding:10px 2px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--mut)}
.result-line{font-family:var(--mono);font-size:12.5px;margin:4px 0 14px;color:var(--ink2)}
.twin{border:1.5px solid var(--line);border-radius:12px;background:var(--card2);padding:16px 18px;margin-top:18px;animation:in .4s ease both}
.twin h4{font-family:var(--serif);font-weight:400;font-size:19px;margin-bottom:4px}
.twin ul{list-style:none;margin:8px 0}
.twin li{padding:6px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.twin .ev{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-top:8px;word-break:break-all}
.pager{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.pager .sp{flex:1}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.lnk{cursor:pointer}table.t tr.lnk:hover td{background:var(--tint)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 4px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ov{margin-top:20px}
.ovg{border-top:1px solid var(--line)}
.ovg summary{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;list-style:none;min-height:44px;flex-wrap:wrap}
.ovg summary::-webkit-details-marker{display:none}
.ovg .chev{font-size:18px;color:var(--mut);transition:transform .2s;width:14px}
.ovg[open] .chev{transform:rotate(90deg)}
.ovg .gn{font-family:var(--serif);font-size:18px}
.ovg .gc{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.ovg .gs{flex:1;font-size:13px;color:var(--ink2);min-width:140px}
.ovg .ovr:first-of-type{border-top:1px solid var(--line-soft,var(--line))}
.ovr{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ovr .nm{font-weight:700}
.ovr .sub{font-size:13px;color:var(--mut);margin-top:2px}
.ovr .res{font-size:14px;color:var(--ink2);margin-top:6px;animation:in .35s ease both}
.ovr .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
button.stat{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.stat:hover{border-color:var(--blue)}
.stat .hint{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:8px}
.player{position:fixed;left:272px;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.player .btn{min-width:92px}
.pmid{flex:1;min-width:200px}
.pmid #pInfo{font-size:12px;letter-spacing:.06em;color:var(--ink2);display:block;margin-bottom:6px}
.pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--gold-bg);transition:width .3s}
#scenSel{font:inherit;font-size:13.5px;width:calc(100% - 28px);margin:2px 14px 8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 8px;min-height:44px}
.paper{scroll-margin-top:90px}
body.api #phaseNav,body.api #resBtn,body.api #wfLbl,body.api #resLbl,body.api aside .nav-i[data-go="-1"],body.api .top,body.api #packBar,body.api #roleBar{display:none!important}
.apihead{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;align-items:center;gap:8px}
.seg .sb{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink2);font:inherit;font-size:13px;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--gold-bg);color:var(--gold-ink);font-weight:700}
.apigrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start;padding-bottom:90px}
.hostp{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.hostp h3{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:4px}
.hostp .hsub{font-size:13px;color:var(--mut);margin-bottom:12px}
.hostp table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13.5px;margin:10px 0}
.hostp th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;background:var(--card2);border-bottom:1px solid var(--line)}
.hostp td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.hostp .cn{display:inline-flex;gap:5px;flex-wrap:wrap}
.hostp .cn span{font-family:var(--mono);font-size:11px;border-radius:6px;padding:2px 7px}
.hostp .cn .ok{background:var(--ok-bg);color:var(--ok)}.hostp .cn .rev{background:var(--rev-bg);color:var(--rev)}.hostp .cn .mis{background:var(--mis-bg);color:var(--mis)}.hostp .cn .nc{background:var(--nc-bg);color:var(--nc)}
.hostp ul{margin:6px 0 6px 18px;font-size:13.5px}.hostp li{margin:3px 0}
.hostp .hnote{font-size:12px;color:var(--mut);border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.hostp .hlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:12px}
.apigrid .hostp,.apigrid .apip{position:sticky;top:76px}
.hostp{max-height:calc(100vh - 170px);overflow:auto}
.apip{max-height:calc(100vh - 170px);overflow:auto;background:#0b1526;color:#d7e3f4;border:1px solid #20324d;border-radius:12px;padding:14px 16px}
.apip .ahead{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8aa0c0;margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap}
.call{border:1px solid #20324d;border-radius:10px;margin:8px 0;background:#0f1d33}
.call>summary{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none;font-family:var(--mono);font-size:12.5px;flex-wrap:wrap}
.call>summary::-webkit-details-marker{display:none}
.call .ar{color:#ffcf7a}.call .mt{color:#7fb2ff;font-weight:700}.call .st{margin-left:auto;color:#9be3a6}
.call .cb{padding:0 12px 12px}
.call .bl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8aa0c0;margin:10px 0 4px;display:flex;gap:10px;align-items:center}
.call .bl button{margin-left:auto;font:inherit;font-size:10.5px;background:#16294a;color:#cfe0ff;border:1px solid #2a4170;border-radius:6px;padding:3px 8px;cursor:pointer}
.call pre{margin:0;background:#091120;border:1px solid #1b2c47;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.5;overflow:auto;max-height:340px;white-space:pre;color:#d7e3f4}
.call pre .k{color:#7fb2ff}.call pre .s{color:#9be3a6}.call pre .n{color:#ffcf7a}.call pre .h{color:#8aa0c0}
.call .note{font-size:12.5px;color:#9db3d1;margin-top:8px;font-family:var(--sans,inherit)}
@media (max-width:1100px){.apigrid{grid-template-columns:1fr}.apigrid .hostp,.apigrid .apip{position:static}.apip,.hostp{max-height:none}}

body.hosted aside,body.hosted .top,body.hosted .banner{display:none!important}
body.hosted .player{left:0}
body.hosted main#view{max-width:none}


#hostBar{position:sticky;top:0;z-index:6}
#hostBar .bk{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
#hostBar .bk:hover{border-color:#2E55C9}
#hostBar select{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 9px;min-height:40px}
#hostBar .seg .label{color:var(--mut)}
#hostBar .seg .sb{border-color:var(--line)}
#hostBar .seg button{background:var(--card);color:var(--ink2);min-height:36px}
#hostBar .seg button.on{background:var(--gold-bg);color:var(--gold-ink)}
.adding .player{display:none}
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.src{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.src.on{border-color:var(--gold-ink,#d9a935);background:var(--gold-bg);color:var(--gold-ink)}
.srcp{max-width:1000px}
.srcp h3{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:4px}
.srcp .hsub{font-size:13px;color:var(--mut);margin-bottom:12px}
.srcp .hnote{font-size:12px;color:var(--mut);border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.srcp table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card2);border:1px solid var(--line)}
.srcp th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.srcp td{padding:10px;border-bottom:1px solid var(--line)}
.frows{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:22px minmax(0,1.4fr) minmax(0,2fr) auto;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;cursor:pointer}
.frow input{width:18px;height:18px}

function applyPos(np){

  var d=ms!=null?ms:(last&&DELAY[ST.speed][last.t]?DELAY[ST.speed][last.t]:1500);
  ST.timer=setTimeout(function(){
    if(!ST.playing)return;
    if(ST.pos>=ST.stopAt||ST.pos>=STEPS.length){pause();return}

    });

  }else{
    var cur=curId();
    h='<h2>'+w.list+'</h2><div class="hn">'+(HT[3]==='imp'?'Open orders':'Outbound shipments')+' for '+esc(partyName(cur))+'. The Compliance tab is provided by VeriPura Core™ inside this platform. Illustrative mock of a trade platform. Use the company list above to show another company.</div><table><thead><tr><th>'+w.title+'</th><th>Route</th><th>Compliance</th><th></th></tr></thead><tbody><tr class="lnk" data-p="'+cur+'"><td><b>'+esc(startDoc(cur).t)+'</b></td><td>'+esc(PK[cur].name)+'</td><td>'+cnHTML(packCounts(cur))+'</td><td>Open</td></tr></tbody></table>';
  }
  $('#host').innerHTML=h;
  document.querySelectorAll('#host tr.lnk').forEach(function(r){r.onclick=function(){openFromHost(r.dataset.p)}});
  hostBar();window.scrollTo({top:0});
}
function openFromHost(id){
  document.body.classList.remove('hl');
  if(PK[id]!==CUR)loadPack(id,-1);
  pause();var r=HT[SC];if(r==='ff')ensureFF();ROLE=r;buildP(r);NP=P.length;build();if(r!=='ff')rs.value=r;
  API.on=true;API.pos=0;API.playing=false;API.stage='add';presel();API.steps=apiSteps();
  document.body.classList.add('api');ST.pos=0;ST.cur=-3;calc();nav();view();updPlayer();hostBar();window.scrollTo({top:0});
}
function setScenario(n){
  SC=n;REQ=false;pause();API.on=false;document.body.classList.remove('api','adding');
  var cur=Object.keys(PK).filter(function(k){return PK[k]===CUR})[0]||'beef';
  $('#scenSel').value=String(n);
  if(n===1){document.body.classList.remove('hl','hosted');$('#startBtn').style.display='';loadPack(cur,-2)}
  else{document.body.classList.add('hosted');$('#startBtn').style.display='none';loadPack(cur,-1);showHost()}
}
$('#scenSel').innerHTML='<option value="1">Importer (Food)</option><option value="3">Importer / Exporter (Core)</option><option value="2">Forwarder / Broker (Core)</option>';
$('#scenSel').onchange=function(){setScenario(+this.value)};
var rs=$('#roleSel');
rs.onchange=function(){setRole(this.value)};$('#mtxBtn').onclick=openMatrix;
$('#packSel').innerHTML=Object.keys(PK).map(function(k){return '<option value="'+k+'">'+esc(PK[k].name)+'</option>'}).join('');
$('#packSel').onchange=function(){REQ=false;loadPack(this.value,SC===1?-2:-1);if(SC!==1){if(document.body.classList.contains('hl'))showHost();else openFromHost(this.value)}};
setScenario(1);
</script>
</body>
</html>
